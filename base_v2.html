<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>牟之记忆法</title>
<style>
:root{--bg:#f5f5f7;--panel:rgba(255,255,255,.72);--card:#fff;--text:#111827;--muted:#6b7280;--line:rgba(15,23,42,.09);--accent:#0071e3;--accent2:#5e5ce6;--shadow:0 18px 50px rgba(15,23,42,.09);--radius:24px}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 15% 5%,#fff 0,#f7f7f9 32%,#eef0f4 100%);color:var(--text);min-height:100vh;transition:.35s}
body.retro{--bg:#b7bd9a;--panel:rgba(214,219,177,.86);--card:#d9dfb6;--text:#26301f;--muted:#56604b;--line:rgba(35,44,29,.16);--accent:#49613d;--accent2:#788c5a;--shadow:0 12px 0 rgba(47,58,39,.12);--radius:12px;background:#aeb58d;background-image:linear-gradient(rgba(255,255,255,.07) 50%,rgba(0,0,0,.03) 50%),radial-gradient(#6d775b 1px,transparent 1px);background-size:100% 4px,12px 12px}
body.retro *{text-rendering:geometricPrecision} body.retro .glass,body.retro .card{border-radius:12px;box-shadow:var(--shadow);backdrop-filter:none} body.retro .brandMark{border-radius:8px;background:#7f8b65;box-shadow:inset 0 0 0 3px #dbe0b9,inset 0 0 0 6px #59654b}
button,input,textarea,select{font:inherit} button{border:0;cursor:pointer;color:inherit}.shell{max-width:1180px;margin:auto;padding:22px 20px 44px}.glass{background:var(--panel);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--line);box-shadow:var(--shadow)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.brandMark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#111827,#454c5f);color:white;display:grid;place-items:center;font-size:20px;box-shadow:0 8px 20px rgba(0,0,0,.12)}.brand h1{font-size:20px;margin:0;letter-spacing:-.03em}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;align-items:center}.iconBtn,.segBtn,.primary,.ghost{min-height:40px;border-radius:14px;padding:0 13px;border:1px solid var(--line);background:rgba(255,255,255,.48);transition:transform .18s,box-shadow .18s,background .18s}.iconBtn{width:42px;padding:0}.primary{background:var(--accent);color:white;border-color:transparent;box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 24%,transparent)}.ghost{background:var(--panel)}.seg{display:flex;gap:6px;padding:5px;border-radius:16px;background:rgba(255,255,255,.45);border:1px solid var(--line)}.segBtn{min-height:34px;border:0;background:transparent}.segBtn.active{background:var(--card);box-shadow:0 4px 12px rgba(0,0,0,.07)}
.hoverLift{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}.hoverLift:hover{transform:translateY(-2px) scale(1.035);box-shadow:0 14px 30px rgba(15,23,42,.12)}body.retro .hoverLift:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 10px 0 rgba(47,58,39,.12)}
.hero{padding:24px;border-radius:var(--radius);display:grid;grid-template-columns:1.5fr .9fr;gap:20px;align-items:stretch}.eyebrow{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.hero h2{font-size:36px;line-height:1.05;margin:10px 0 12px;letter-spacing:-.05em}.hero p{color:var(--muted);max-width:600px;line-height:1.65;margin:0}.heroBtns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:rgba(255,255,255,.52);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:center}.stat b{font-size:30px;letter-spacing:-.04em}.stat span{margin-top:4px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.sectionHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.sectionHead h3{margin:0;font-size:17px}.sectionHead span{color:var(--muted);font-size:12px}.wordGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.word{padding:15px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.42);display:flex;justify-content:space-between;gap:12px;align-items:center}.word strong{font-size:19px}.word small{display:block;color:var(--muted);margin-top:4px}.pill{font-size:11px;padding:6px 9px;border-radius:999px;background:rgba(0,113,227,.09);color:var(--accent);white-space:nowrap}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.meter{height:10px;border-radius:999px;background:rgba(127,127,127,.15);overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit;transition:width .4s}.miniRow{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:10px 0 6px}.modeCard{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;border-radius:18px;background:rgba(255,255,255,.46);border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.38);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalBox{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:28px;padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.22)}.close{float:right;width:36px;height:36px;border-radius:12px;background:rgba(127,127,127,.12)}.quizQ{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{padding:15px;border:1px solid var(--line);background:rgba(127,127,127,.06);border-radius:16px;text-align:left}.opt.correct{outline:2px solid #34c759;background:rgba(52,199,89,.12)}.opt.wrong{outline:2px solid #ff3b30;background:rgba(255,59,48,.12)}.quizFoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:12px}.shareBox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.shareBox input,textarea,.field{width:100%;border:1px solid var(--line);background:rgba(127,127,127,.07);border-radius:14px;padding:12px;color:inherit}.field{margin-bottom:10px}.formRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.note{font-size:12px;color:var(--muted);line-height:1.6}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}
.retro .hero h2,.retro .quizQ{font-family:monospace;letter-spacing:0}.retro .primary{border-radius:8px;background:#596a48;color:#ebf0c8}.retro .word,.retro .stat,.retro .modeCard{background:rgba(237,242,201,.3);border-color:rgba(55,67,41,.22)}
@media(max-width:820px){.hero,.grid{grid-template-columns:1fr}.wordGrid{grid-template-columns:1fr}.hero h2{font-size:30px}.topbar{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.options{grid-template-columns:1fr}.formRow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><div class="brandMark">牟</div><div><h1>牟之记忆法</h1><p>把每天遇到的英语，变成真正记得住的能力</p></div></div>
    <div class="actions">
      <button class="iconBtn hoverLift" id="shareBtn" title="生成分享链接">↗</button>
      <div class="seg"><button class="segBtn active" data-theme="normal">正常</button><button class="segBtn" data-theme="retro">掌机</button></div>
    </div>
  </div>

  <section class="hero glass hoverLift">
    <div><div class="eyebrow">MEMORY SYSTEM</div><h2>今天复习一点，<br>以后轻松很多。</h2><p>按照间隔复习记录你的词汇。每轮复习之后，系统会重新计算下一次复习时间。完成后还能随机抽取 10 个词做测试。</p><div class="heroBtns"><button class="primary hoverLift" id="reviewBtn">开始今日复习</button><button class="ghost hoverLift" id="quizBtn">随机 10 题</button></div></div>
    <div class="stats"><div class="stat hoverLift"><b id="dueCount">0</b><span>今日待复习</span></div><div class="stat hoverLift"><b id="knownCount">0</b><span>已掌握</span></div><div class="stat hoverLift"><b id="totalCount">0</b><span>我的词库</span></div><div class="stat hoverLift"><b id="streak">0</b><span>连续学习天数</span></div></div>
  </section>

  <div class="grid">
    <section class="card hoverLift"><div class="sectionHead"><h3>今日词库</h3><span id="todayText"></span></div><div id="wordList" class="wordGrid"></div></section>
    <aside class="card hoverLift">
      <div class="sectionHead"><h3>学习进度</h3><span id="progressText">0%</span></div><div class="meter"><i id="progressBar"></i></div>
      <div class="miniRow"><span>复习轮次</span><b id="roundText">0</b></div>
      <div class="modeCard" style="margin-top:14px"><div><b>背景模式</b><div class="note">正常玻璃风 / 日式复古掌机</div></div><span id="themeBadge">正常</span></div>
      <div style="display:grid;gap:8px;margin-top:14px"><button class="ghost hoverLift" id="addBtn">＋ 添加单词/词组</button><button class="ghost hoverLift" id="exportBtn">↓ 导出词库</button><button class="ghost hoverLift" id="importBtn">↑ 导入词库</button></div>
    </aside>
  </div>
</div>

<div class="modal" id="modal"><div class="modalBox"><button class="close" id="closeBtn">×</button><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<input id="fileInput" type="file" accept="application/json" style="display:none"/>
<script>
const KEY='mz_memory_v2';
const intervals=[1,2,4,7,15,30];
const seed=[
 ['pounce','/paʊns/','猛扑；突然扑向','The cat pounced on the mouse.'],['duck','/dʌk/','鸭子；低头躲避','I saw a duck in the park.'],['get settled','/ɡet ˈsetld/','安顿下来；适应','Let’s get settled before dinner.'],['runny nose','/ˌrʌni ˈnoʊz/','流鼻涕','I have a runny nose today.'],['democracy','/dɪˈmɑːkrəsi/','民主','Democracy gives people a voice.'],['conditions','/kənˈdɪʃənz/','条件；环境；情况','The weather conditions were tough.'],['placement','/ˈpleɪsmənt/','实习；工作安排','I am looking for a hospitality placement.'],['fast-paced','/ˌfæst ˈpeɪst/','节奏快的','It is a fast-paced workplace.'],['customer service','/ˈkʌstəmər ˈsɜːrvɪs/','客户服务','Good customer service matters.'],['adaptable','/əˈdæptəbəl/','适应性强的','I am adaptable and willing to learn.']
];
function today(){return new Date().toISOString().slice(0,10)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
let state=load()||{theme:'normal',words:seed.map((x,i)=>({word:x[0],pron:x[1],meaning:x[2],example:x[3],round:0,due:today(),created:today(),last:null})),history:{},streak:0};
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function due(w){return !w.due||w.due<=today()}
function fmtDate(d){return d?new Date(d+'T00:00:00').toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}):''}
function addDays(base,n){let d=new Date((base||today())+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function render(){document.body.classList.toggle('retro',state.theme==='retro');document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===state.theme));document.getElementById('themeBadge').textContent=state.theme==='retro'?'掌机':'正常';
 const dueW=state.words.filter(due), known=state.words.filter(w=>w.round>=5).length;document.getElementById('dueCount').textContent=dueW.length;document.getElementById('knownCount').textContent=known;document.getElementById('totalCount').textContent=state.words.length;document.getElementById('streak').textContent=calcStreak();document.getElementById('todayText').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric'});
 const progress=state.words.length?Math.round(known/state.words.length*100):0;document.getElementById('progressText').textContent=progress+'%';document.getElementById('progressBar').style.width=progress+'%';document.getElementById('roundText').textContent=state.words.length?Math.round(state.words.reduce((a,w)=>a+w.round,0)/state.words.length*10)/10:0;
 const box=document.getElementById('wordList');let arr=dueW.slice(0,10); if(!arr.length) arr=state.words.slice(0,10);box.innerHTML=arr.length?arr.map(w=>`<div class="word hoverLift"><div><strong>${esc(w.word)}</strong><small>${esc(w.meaning)}</small></div><span class="pill">${w.round===0?'新词':'第 '+w.round+' 轮'}</span></div>`).join(''):'<div class="empty" style="grid-column:1/-1">还没有词库，先添加几个吧。</div>';
}
function calcStreak(){let keys=Object.keys(state.history).sort().reverse();let s=0, d=new Date(today()+'T00:00:00');for(let i=0;i<keys.length;i++){let k=d.toISOString().slice(0,10);if(keys.includes(k)){s++;d.setDate(d.getDate()-1)}else break}return s}
function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function review(){let dueW=state.words.filter(due);if(!dueW.length){openModal(`<h2>今天没有到期词了 🎉</h2><p class="note">可以直接做一轮随机 10 题，巩固一下。</p><button class="primary hoverLift" onclick="quiz()">去做测试</button>`);return}let i=0;const next=()=>{if(i>=dueW.length){state.history[today()]=true;save();openModal(`<h2>今日复习完成 ✅</h2><p class="note">${dueW.length} 个词已重新安排复习时间。</p><button class="primary hoverLift" onclick="closeModal()">完成</button>`);return}let w=dueW[i];openModal(`<div class="eyebrow">TODAY'S REVIEW</div><div class="quizQ">${esc(w.word)}</div><p><b>${esc(w.pron||'')}</b></p><p>${esc(w.meaning)}</p><p class="note">${esc(w.example||'')}</p><div class="quizFoot"><span>${i+1} / ${dueW.length}</span><button class="primary hoverLift" id="rememberBtn">我记住了</button></div>`);document.getElementById('rememberBtn').onclick=()=>{w.round=Math.min(w.round+1,intervals.length);w.last=today();w.due=addDays(today(),intervals[Math.max(0,w.round-1)]);state.history[today()]=true;save();i++;next()}}
 next()}
function quiz(){let pool=[...state.words].sort(()=>Math.random()-.5).slice(0,Math.min(10,state.words.length));if(!pool.length){openModal('<h2>还没有词库</h2><p class="note">先添加单词，再开始测试。</p>');return}let idx=0,score=0;const ask=()=>{if(idx>=pool.length){state.history[today()]=true;save();openModal(`<h2>测试完成 🎯</h2><div class="quizQ">${score} / ${pool.length}</div><p class="note">正确率 ${Math.round(score/pool.length*100)}%。再做一次或去复习薄弱词汇。</p><button class="primary hoverLift" onclick="closeModal()">完成</button>`);return}let w=pool[idx];let opts=[w.meaning,...state.words.filter(x=>x.word!==w.word).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.meaning)].sort(()=>Math.random()-.5);openModal(`<div class="eyebrow">RANDOM QUIZ</div><div class="quizFoot"><span>第 ${idx+1} / ${pool.length} 题</span><span>得分 ${score}</span></div><div class="quizQ">${esc(w.word)}</div><div class="options">${opts.map(o=>`<button class="opt hoverLift">${esc(o)}</button>`).join('')}</div>`);document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let correct=b.textContent===w.meaning;b.classList.add(correct?'correct':'wrong');if(correct)score++;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);setTimeout(()=>{idx++;ask()},450)})};ask()}
function add(){openModal(`<h2>添加单词 / 词组</h2><div class="formRow"><input class="field" id="fWord" placeholder="单词或词组"><input class="field" id="fPron" placeholder="音标（可选）"></div><input class="field" id="fMeaning" placeholder="中文意思"><input class="field" id="fExample" placeholder="例句（可选）"><button class="primary hoverLift" id="saveWord">加入词库</button>`);document.getElementById('saveWord').onclick=()=>{let word=document.getElementById('fWord').value.trim(),meaning=document.getElementById('fMeaning').value.trim();if(!word||!meaning)return toast('请输入单词和中文意思');state.words.push({word,pron:document.getElementById('fPron').value.trim(),meaning,example:document.getElementById('fExample').value.trim(),round:0,due:today(),created:today(),last:null});save();closeModal();toast('已加入牟之记忆法')}}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='牟之记忆法-词库.json';a.click();URL.revokeObjectURL(a.href);toast('词库已导出')}
function importData(){document.getElementById('fileInput').click()}
document.getElementById('fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let n=JSON.parse(r.result);if(!n.words)throw new Error();state=n;save();toast('词库导入成功')}catch(_){toast('文件格式不正确')}};r.readAsText(f)}
function makeShare(){let payload=btoa(unescape(encodeURIComponent(JSON.stringify({words:state.words,theme:state.theme}))));let url=location.origin+location.pathname+'#share='+payload;navigator.clipboard?.writeText(url).then(()=>toast('分享链接已复制'))||prompt('复制这个分享链接',url)}
function readShare(){if(location.hash.startsWith('#share=')){try{let raw=decodeURIComponent(escape(atob(location.hash.slice(7))));let d=JSON.parse(raw);state.words=d.words||state.words;state.theme=d.theme||state.theme;save();history.replaceState(null,'',location.pathname);toast('已载入分享词库')}catch(e){}}}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
document.getElementById('reviewBtn').onclick=review;document.getElementById('quizBtn').onclick=quiz;document.getElementById('addBtn').onclick=add;document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=importData;document.getElementById('shareBtn').onclick=makeShare;document.getElementById('closeBtn').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;save()});
readShare();render();
</script>
</body></html>
