<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>牟之记忆法 · AI 英语记忆</title>
<style>
:root{--bg:#f5f5f7;--panel:rgba(255,255,255,.74);--card:#fff;--text:#121318;--muted:#6e737e;--line:rgba(17,24,39,.09);--accent:#0071e3;--accent2:#7c5cff;--good:#34c759;--bad:#ff3b30;--shadow:0 20px 60px rgba(15,23,42,.10);--radius:26px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
body{background:radial-gradient(circle at 12% 4%,#fff 0,#f7f7f9 34%,#e9edf4 100%);transition:.35s}
button,input,textarea{font:inherit}button{border:0;cursor:pointer;color:inherit}.shell{max-width:1200px;margin:auto;padding:18px 18px 46px}.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);box-shadow:var(--shadow)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:50px;height:50px;border-radius:17px;position:relative;display:grid;place-items:center;background:linear-gradient(145deg,#fff 0,#eef2ff 45%,#ddd9ff 100%);box-shadow:0 10px 24px rgba(91,76,255,.14);transition:transform .25s}.logo:hover{transform:rotate(-4deg) scale(1.08)}.logo svg{width:38px;height:38px}.brand h1{margin:0;font-size:20px;letter-spacing:-.035em}.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.iconBtn,.seg button,.primary,.ghost{min-height:40px;padding:0 13px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.48);transition:transform .18s,box-shadow .18s,background .18s}.iconBtn{width:44px;padding:0}.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 9px 20px color-mix(in srgb,var(--accent) 25%,transparent)}.ghost{background:var(--panel)}.hover:hover{transform:translateY(-2px) scale(1.035);box-shadow:0 14px 28px rgba(15,23,42,.12)}.seg{display:flex;gap:5px;padding:4px;border-radius:15px;background:rgba(255,255,255,.44);border:1px solid var(--line)}.seg button{min-height:32px;border:0;background:transparent;padding:0 10px}.seg button.active{background:var(--card);box-shadow:0 4px 13px rgba(0,0,0,.08)}
.hero{padding:24px;border-radius:var(--radius);display:grid;grid-template-columns:1.2fr .9fr;gap:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:var(--accent)}.hero h2{font-size:38px;line-height:1.04;margin:10px 0 10px;letter-spacing:-.055em}.hero p{max-width:680px;line-height:1.65;color:var(--muted);margin:0}.heroBtns{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:17px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.52)}.stat b{display:block;font-size:30px;letter-spacing:-.05em}.stat span{font-size:12px;color:var(--muted)}
.mainGrid{display:grid;grid-template-columns:1fr .92fr;gap:16px;margin-top:16px}.card{border-radius:var(--radius);padding:20px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.sectionHead h3{font-size:17px;margin:0}.sectionHead small{color:var(--muted)}.progress{height:9px;border-radius:99px;background:rgba(127,127,127,.14);overflow:hidden}.progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.4s}.wordList{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.wordItem{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:13px 14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.42);transition:.2s}.wordItem:hover{transform:translateY(-2px);background:rgba(255,255,255,.7)}.wordItem strong{font-size:16px}.wordItem small{display:block;color:var(--muted);margin-top:3px}.badge{font-size:11px;padding:6px 8px;border-radius:99px;background:rgba(0,113,227,.09);color:var(--accent);white-space:nowrap}.note{font-size:12px;line-height:1.6;color:var(--muted)}
.aiBox{display:flex;flex-direction:column;min-height:540px}.chat{flex:1;min-height:280px;max-height:520px;overflow:auto;padding:2px 2px 12px}.msg{display:flex;margin:9px 0}.msg.user{justify-content:flex-end}.bubble{max-width:88%;padding:11px 13px;border-radius:18px;background:rgba(127,127,127,.08);line-height:1.55;font-size:14px;white-space:pre-wrap}.msg.user .bubble{background:var(--accent);color:#fff}.aiWordCard{margin-top:10px;border:1px solid var(--line);background:rgba(255,255,255,.64);border-radius:19px;padding:14px}.aiWordTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.aiWord{font-size:25px;font-weight:800;letter-spacing:-.04em}.pron{color:var(--muted);font-size:12px;margin-top:3px}.meaning{font-size:15px;font-weight:700;margin-top:8px}.example{margin-top:8px;font-size:13px;line-height:1.55}.translation{font-size:12px;color:var(--muted);margin-top:4px}.aiActions{display:flex;gap:8px;margin-top:11px}.autoSave{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin:8px 0 10px}.autoSave input{accent-color:var(--accent)}.composer{display:grid;grid-template-columns:1fr auto;gap:9px}.composer textarea{resize:none;min-height:52px;max-height:120px;border:1px solid var(--line);background:rgba(255,255,255,.57);border-radius:17px;padding:13px;color:inherit;outline:none}.composer textarea:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.38);display:none;align-items:center;justify-content:center;padding:17px;z-index:50}.modal.show{display:flex}.modalBox{width:min(720px,100%);max-height:91vh;overflow:auto;border-radius:28px;background:var(--card);padding:22px;box-shadow:0 30px 90px rgba(0,0,0,.22)}.close{float:right;width:36px;height:36px;border-radius:12px;background:rgba(127,127,127,.1)}.field{width:100%;border:1px solid var(--line);background:rgba(127,127,127,.07);border-radius:14px;padding:12px;color:inherit;margin-bottom:10px}.formRow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quizQ{font-size:31px;font-weight:850;letter-spacing:-.04em;margin:17px 0 8px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.opt{text-align:left;padding:14px;border:1px solid var(--line);background:rgba(127,127,127,.06);border-radius:16px;transition:.16s}.opt.correct{outline:2px solid var(--good);background:rgba(52,199,89,.11)}.opt.wrong{outline:2px solid var(--bad);background:rgba(255,59,48,.11)}.quizFoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px;color:var(--muted);font-size:12px}.meaningHidden{filter:blur(8px);cursor:pointer;user-select:none}.reviewCard{text-align:center}.reviewMascot{width:90px;height:90px;margin:2px auto 10px;border-radius:28px;background:linear-gradient(145deg,#fce6f2,#ddd8ff);display:grid;place-items:center;box-shadow:0 14px 28px rgba(126,105,255,.13)}.reviewMascot svg{width:64px;height:64px}.brushFlash{animation:brush .22s ease}@keyframes brush{0%{transform:scale(1)}45%{transform:scale(1.025);box-shadow:0 0 0 10px rgba(124,92,255,.12)}100%{transform:scale(1)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:11px 15px;border-radius:13px;z-index:80;transition:.24s}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
/* retro */
body.retro{--panel:rgba(211,220,179,.92);--card:#dce4b8;--text:#28311e;--muted:#5a654d;--line:rgba(43,51,31,.18);--accent:#536c43;--accent2:#81945f;--shadow:0 9px 0 rgba(48,59,37,.13);--radius:12px;background:#aeb68d;background-image:linear-gradient(rgba(255,255,255,.08) 50%,rgba(0,0,0,.035) 50%),radial-gradient(#687452 1px,transparent 1px);background-size:100% 4px,12px 12px}body.retro .glass,body.retro .card{backdrop-filter:none}.retro .logo{background:#d6ddaa;box-shadow:inset 0 0 0 4px #74815a,inset 0 0 0 8px #bec795}.retro .logo svg{filter:saturate(.55)}.retro .hero h2,.retro .quizQ,.retro .aiWord{font-family:monospace;letter-spacing:0}.retro .hero,.retro .card{box-shadow:var(--shadow)}.retro .primary{background:#566b44;border-radius:8px}.retro .hover:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 8px 0 rgba(47,58,39,.11)}.px{display:none}.retro .px{display:block;position:fixed;z-index:60;pointer-events:none}.px.tl{left:9px;top:9px}.px.tr{right:9px;top:9px;transform:scaleX(-1)}.px.bl{left:9px;bottom:9px;transform:scaleY(-1)}.px.br{right:9px;bottom:9px;transform:scale(-1)}.pixmon{width:62px;height:62px;position:relative;image-rendering:pixelated}.pixmon:before{content:"";position:absolute;width:14px;height:14px;left:10px;top:16px;background:#526144;box-shadow:28px 0 #526144,14px 14px #83915e,0 28px #83915e,28px 28px #83915e,7px 7px #d7dea9,35px 7px #d7dea9}.pixmon:after{content:"";position:absolute;width:6px;height:6px;left:17px;top:22px;background:#27321e;box-shadow:28px 0 #27321e,7px 21px #27321e,21px 21px #27321e}
@media(max-width:900px){.hero,.mainGrid{grid-template-columns:1fr}.wordList{grid-template-columns:1fr}.hero h2{font-size:31px}.topbar{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}}
@media(max-width:650px){.shell{padding:12px 12px 30px}.brand p{display:none}.actions{gap:5px}.hero,.card{padding:16px;border-radius:21px}.stats{grid-template-columns:repeat(2,1fr)}.composer{grid-template-columns:1fr}.options{grid-template-columns:1fr}.formRow{grid-template-columns:1fr}.chat{max-height:430px}}
</style>
</head>
<body>
<div class="px tl"><div class="pixmon"></div></div><div class="px tr"><div class="pixmon"></div></div><div class="px bl"><div class="pixmon"></div></div><div class="px br"><div class="pixmon"></div></div>
<div class="shell">
<header class="topbar">
  <div class="brand">
    <div class="logo" title="牟之记忆法">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7cff"/><stop offset="1" stop-color="#ff96c8"/></linearGradient></defs><path d="M18 25c0-7 6-12 14-12s14 5 14 12v12c0 9-6 15-14 15S18 46 18 37Z" fill="url(#g)"/><circle cx="27" cy="30" r="3" fill="#fff"/><circle cx="37" cy="30" r="3" fill="#fff"/><circle cx="27" cy="30" r="1.3" fill="#2b2346"/><circle cx="37" cy="30" r="1.3" fill="#2b2346"/><path d="M28 39c2.5 2.5 5.5 2.5 8 0" fill="none" stroke="#2b2346" stroke-width="2.5" stroke-linecap="round"/><path d="M20 22 12 15M44 22l8-7" stroke="#8f7cff" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
    <div><h1>牟之记忆法</h1><p>AI 英语 · 间隔复习 · 每天记住一点</p></div>
  </div>
  <div class="actions">
    <button class="iconBtn hover" id="accountBtn" title="云端账号">◎</button>
    <button class="iconBtn hover" id="shareBtn" title="分享词库">↗</button>
    <div class="seg"><button class="active" data-theme="normal">正常</button><button data-theme="retro">掌机</button></div>
  </div>
</header>
<section class="hero glass hover">
  <div><div class="eyebrow">MEMORY SYSTEM + AI</div><h2>今天问一个词，<br>以后真的记得住。</h2><p>现在可以直接在右侧 AI 聊天框问词义。AI 会整理音标、中文、例句，并可自动加入你的词库，然后进入 1 / 2 / 4 / 7 / 15 / 30 天间隔复习。</p><div class="heroBtns"><button class="primary hover" id="reviewBtn">开始今日复习</button><button class="ghost hover" id="quizBtn">随机 10 题</button><button class="ghost hover" id="addBtn">手动加词</button></div></div>
  <div class="stats"><div class="stat"><b id="dueCount">0</b><span>今日待复习</span></div><div class="stat"><b id="wordCount">0</b><span>我的词库</span></div><div class="stat"><b id="streak">0</b><span>学习记录</span></div><div class="stat"><b id="mastered">0%</b><span>复习进度</span></div></div>
</section>
<div class="mainGrid">
  <section class="card"><div class="sectionHead"><h3>📚 今日复习</h3><small id="todayText"></small></div><div class="progress"><i id="progressBar"></i></div><div class="wordList" id="wordList"></div></section>
  <section class="card aiBox"><div class="sectionHead"><h3>🤖 AI 单词教练</h3><small id="aiStatus">待提问</small></div><div class="chat" id="chat"></div><label class="autoSave"><input type="checkbox" id="autoSave" checked> AI 识别到单词后自动加入我的词库</label><div class="composer"><textarea id="prompt" placeholder="例如：pounce 是什么意思？给我一个生活场景例句"></textarea><button class="primary hover" id="sendBtn">发送</button></div><p class="note" style="margin-bottom:0">在线部署后，这里会调用你的 AI API；API 密钥放在服务器环境变量里，不放进网页源码。</p></section>
</div>
<section class="card" style="margin-top:16px"><div class="sectionHead"><h3>工具</h3><small>本地也可以用</small></div><div class="heroBtns" style="margin-top:0"><button class="ghost hover" id="exportBtn">导出词库</button><button class="ghost hover" id="importBtn">导入词库</button><button class="ghost hover" id="clearChatBtn">清空 AI 对话</button></div><input id="fileInput" type="file" accept="application/json" hidden></section>
</div>
<div class="modal" id="modal"><div class="modalBox"><button class="close" id="closeBtn">×</button><div id="modalContent"></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='mz_memory_v4_state';
const intervals=[1,2,4,7,15,30];
const sample=[
 {word:'pounce',pron:'/paʊns/',meaning:'猛扑；突然扑向',example:'The cat pounced on the mouse.',translation:'猫猛地扑向那只老鼠。'},
 {word:'duck',pron:'/dʌk/',meaning:'鸭子；弯身躲避',example:'I saw a duck in the park.',translation:'我在公园看到了一只鸭子。'},
 {word:'polar bear',pron:'/ˈpoʊlər ber/',meaning:'北极熊',example:'We saw a polar bear at the zoo.',translation:'我们在动物园看到了北极熊。'},
 {word:'get settled',pron:'/ɡet ˈsetəld/',meaning:'安顿下来；稳定下来',example:'Give me a few minutes to get settled.',translation:'给我几分钟安顿一下。'},
 {word:'runny nose',pron:'/ˈrʌni noʊz/',meaning:'流鼻涕',example:'I have a runny nose today.',translation:'我今天有点流鼻涕。'},
 {word:'overweight fee',pron:'/ˌoʊvərˈweɪt fiː/',meaning:'超重费',example:'I had to pay an overweight fee at the airport.',translation:'我在机场不得不支付超重费。'},
 {word:'boarding pass',pron:'/ˈbɔːrdɪŋ pæs/',meaning:'登机牌',example:'Please show me your boarding pass.',translation:'请出示你的登机牌。'},
 {word:'overhead compartment',pron:'/ˈoʊvərhed kəmˈpɑːrtmənt/',meaning:'头顶行李舱',example:'Put your bag in the overhead compartment.',translation:'把你的包放进头顶行李舱。'},
 {word:'fast-paced',pron:'/ˌfæst ˈpeɪst/',meaning:'节奏快的',example:'I enjoy working in a fast-paced environment.',translation:'我喜欢在快节奏的环境中工作。'},
 {word:'adaptable',pron:'/əˈdæptəbəl/',meaning:'适应能力强的；灵活的',example:'I am adaptable and willing to learn.',translation:'我适应能力强，也愿意学习。'}
].map((x,i)=>({...x,round:0,due:isoToday(),created:isoToday(),last:null,id:'seed-'+i}));
let state=loadState();let session=null;let supabase=null;let audioCtx=null;
function isoToday(){const d=new Date();return d.toISOString().slice(0,10)}
function addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function due(w){return w.due<=isoToday()}
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.words))return s}catch(e){}return {words:sample.map(x=>({...x})),theme:'normal',history:{},chat:[]}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function render(){document.body.classList.toggle('retro',state.theme==='retro');document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===state.theme));const dueList=state.words.filter(due);document.getElementById('dueCount').textContent=dueList.length;document.getElementById('wordCount').textContent=state.words.length;document.getElementById('streak').textContent=Object.keys(state.history||{}).length;const done=state.words.length?Math.round(state.words.filter(w=>w.round>0).length/state.words.length*100):0;document.getElementById('mastered').textContent=done+'%';const prog=state.words.length?Math.round((state.words.filter(w=>!due(w)).length/state.words.length)*100):0;document.getElementById('progressBar').style.width=prog+'%';document.getElementById('todayText').textContent=isoToday();document.getElementById('wordList').innerHTML=dueList.length?dueList.slice(0,8).map(w=>`<div class="wordItem"><div><strong>${esc(w.word)}</strong><small>${esc(w.meaning)}</small></div><span class="badge">第 ${Math.min((w.round||0)+1,intervals.length)} 轮</span></div>`).join(''):'<div class="empty" style="grid-column:1/-1">今天没有到期词 🎉</div>';renderChat()}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function speak(text,lang='en-US'){if(!text||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.9;speechSynthesis.speak(u)}
async function ensureAudio(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')await audioCtx.resume();return audioCtx}
async function brush(){const c=await ensureAudio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='triangle';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(1200,t+.10);o.frequency.exponentialRampToValueAtTime(1800,t+.16);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.20);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.2)}
function review(){const pool=state.words.filter(due);if(!pool.length){openModal('<h2>今天没有到期词啦 🎉</h2><p class="note">可以直接做随机 10 题巩固。</p><button class="primary hover" id="goQuiz">去测试</button>');document.getElementById('goQuiz').onclick=quiz;return}let i=0;const next=()=>{if(i>=pool.length){state.history[isoToday()]=true;save();openModal(`<h2>今日复习完成 ✨</h2><p class="note">${pool.length} 个词已安排下一轮。</p><button class="primary hover" id="done">完成</button>`);document.getElementById('done').onclick=closeModal;return}const w=pool[i];openModal(`<div class="reviewCard" id="reviewWrap"><div class="eyebrow">MEMORY REVIEW · ${i+1}/${pool.length}</div><div class="reviewMascot"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="23" fill="#9b8cff"/><circle cx="25" cy="30" r="3.6" fill="#fff"/><circle cx="39" cy="30" r="3.6" fill="#fff"/><circle cx="25" cy="30" r="1.4"/><circle cx="39" cy="30" r="1.4"/><path d="M27 40c3 3 7 3 10 0" fill="none" stroke="#27203f" stroke-width="2.4" stroke-linecap="round"/></svg></div><div class="quizQ">${esc(w.word)}</div><div class="pron">${esc(w.pron||'')}</div><button class="ghost hover" id="playWord" style="margin-top:9px">🔊 单词</button><div style="margin:16px 0"><button class="meaningHidden" id="meaning" style="background:transparent;border:0;font-size:18px;font-weight:800">${esc(w.meaning)}</button><div class="note">点击显示中文意思</div></div><div class="example"><b>${esc(w.example||'')}</b><div class="translation">${esc(w.translation||'')}</div><button class="ghost hover" id="playEx" style="margin-top:10px">🔊 例句</button></div><div class="quizFoot"><span>艾宾浩斯 · ${intervals[Math.min(w.round||0,intervals.length-1)]||1} 天</span><button class="primary hover" id="remember">刷掉这个词 ✓</button></div></div>`);speak(w.word);setTimeout(()=>w.example&&speak(w.example),750);document.getElementById('playWord').onclick=()=>speak(w.word);document.getElementById('playEx').onclick=()=>speak(w.example||'');document.getElementById('meaning').onclick=e=>{e.currentTarget.classList.remove('meaningHidden')};document.getElementById('remember').onclick=async()=>{document.getElementById('reviewWrap').classList.add('brushFlash');await brush();w.last=isoToday();w.round=Math.min((w.round||0)+1,intervals.length);w.due=addDays(isoToday(),intervals[Math.min(w.round-1,intervals.length-1)]);state.history[isoToday()]=true;save();i++;setTimeout(next,180)}};next()}
function quiz(){const pool=[...state.words].sort(()=>Math.random()-.5).slice(0,Math.min(10,state.words.length));if(!pool.length)return;let idx=0,score=0;const ask=()=>{if(idx>=pool.length){openModal(`<h2>测试完成 🎯</h2><div class="quizQ">${score} / ${pool.length}</div><p class="note">正确率 ${Math.round(score/pool.length*100)}%。</p><button class="primary hover" onclick="closeModal()">完成</button>`);return}const w=pool[idx],opts=[w.meaning,...state.words.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.meaning)].sort(()=>Math.random()-.5);openModal(`<div class="eyebrow">RANDOM QUIZ</div><div class="quizFoot"><span>第 ${idx+1} / ${pool.length} 题</span><span>得分 ${score}</span></div><div class="quizQ">${esc(w.word)}</div><button class="ghost hover" id="qSpeak">🔊 发音</button><div class="options">${opts.map(o=>`<button class="opt hover">${esc(o)}</button>`).join('')}</div>`);document.getElementById('qSpeak').onclick=()=>speak(w.word);document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.textContent===w.meaning;b.classList.add(ok?'correct':'wrong');if(ok)score++;document.querySelectorAll('.opt').forEach(x=>x.disabled=true);setTimeout(()=>{idx++;ask()},430)})};ask()}
function add(){openModal(`<h2>添加单词 / 词组</h2><div class="formRow"><input class="field" id="fWord" placeholder="单词或词组"><input class="field" id="fPron" placeholder="音标（可选）"></div><input class="field" id="fMeaning" placeholder="中文意思"><input class="field" id="fExample" placeholder="例句（可选）"><input class="field" id="fTranslation" placeholder="例句翻译（可选）"><button class="primary hover" id="saveWord">加入词库</button>`);document.getElementById('saveWord').onclick=()=>{const word=document.getElementById('fWord').value.trim(),meaning=document.getElementById('fMeaning').value.trim();if(!word||!meaning)return toast('请输入单词和中文意思');upsertWord({word,pron:document.getElementById('fPron').value.trim(),meaning,example:document.getElementById('fExample').value.trim(),translation:document.getElementById('fTranslation').value.trim()});closeModal();toast('已加入词库')}}
function upsertWord(w){const old=state.words.find(x=>x.word.toLowerCase()===w.word.toLowerCase());if(old){Object.assign(old,w)}else{state.words.unshift({...w,id:'w-'+Date.now(),round:0,due:isoToday(),created:isoToday(),last:null})}save()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='牟之记忆法-词库.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){document.getElementById('fileInput').click()}
document.getElementById('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(!n.words)throw 0;state=n;save();toast('词库导入成功')}catch(_){toast('词库文件格式不正确')}};r.readAsText(f)}
function makeShare(){const payload=btoa(unescape(encodeURIComponent(JSON.stringify({words:state.words,theme:state.theme}))));if(location.protocol==='file:'){prompt('请部署到 Vercel/Netlify 后再分享，数据链接结构如下',location.href.split('#')[0]+'#share='+payload);return}const url=location.origin+location.pathname+'#share='+payload;if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('分享链接已复制')).catch(()=>prompt('复制链接',url));else prompt('复制链接',url)}
function readShare(){if(!location.hash.startsWith('#share='))return;try{const raw=decodeURIComponent(escape(atob(location.hash.slice(7)))),d=JSON.parse(raw);if(Array.isArray(d.words)){state.words=d.words;state.theme=d.theme||state.theme;save();history.replaceState(null,'',location.pathname);toast('已载入分享词库')}}catch(e){}}
function renderChat(){const el=document.getElementById('chat');if(!state.chat?.length){el.innerHTML='<div class="empty">试试问：<b>“pounce 是什么意思？给我一个生活场景例句”</b></div>';return}el.innerHTML=state.chat.map(m=>{if(m.role==='user')return `<div class="msg user"><div class="bubble">${esc(m.content)}</div></div>`;const d=m.data;return `<div class="msg"><div class="bubble">${esc(m.text||'')}${d?`<div class="aiWordCard"><div class="aiWordTop"><div><div class="aiWord">${esc(d.word||'')}</div><div class="pron">${esc(d.pronunciation||'')}</div></div><button class="ghost hover" onclick="speak(${JSON.stringify(d.word||'')})">🔊</button></div><div class="meaning">${esc(d.meaning||'')}</div><div class="example">${esc(d.example||'')}</div><div class="translation">${esc(d.translation||'')}</div><div class="aiActions"><button class="primary hover" onclick='saveAiWord(${JSON.stringify(d).replace(/'/g,"&#39;")})'>加入词库</button></div></div>`:''}</div></div>`}).join('');el.scrollTop=el.scrollHeight}
function saveAiWord(d){upsertWord({word:d.word,pron:d.pronunciation||d.pron||'',meaning:d.meaning,example:d.example||'',translation:d.translation||''});toast('已加入牟之记忆法');speak(d.word)}
async function askAI(){const input=document.getElementById('prompt'),q=input.value.trim();if(!q)return;state.chat=state.chat||[];state.chat.push({role:'user',content:q});input.value='';save();document.getElementById('aiStatus').textContent='思考中…';document.getElementById('sendBtn').disabled=true;try{const res=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:q,history:state.chat.slice(-8),autoSave:document.getElementById('autoSave').checked})});if(!res.ok)throw new Error((await res.text())||'API 请求失败');const d=await res.json();state.chat.push({role:'assistant',text:d.reply||'',data:d.word||null});if(d.word&&document.getElementById('autoSave').checked)upsertWord({word:d.word.word,pron:d.word.pronunciation||'',meaning:d.word.meaning,example:d.word.example||'',translation:d.word.translation||''});else save();document.getElementById('aiStatus').textContent='在线';if(d.word)speak(d.word.word);if(d.word&&d.word.example)setTimeout(()=>speak(d.word.example),700)}catch(e){state.chat.push({role:'assistant',text:'AI 暂时无法连接。部署网站后，请确认服务器已配置 OPENAI_API_KEY；本地打开 index.html 时没有 /api/chat 后端。'});save();document.getElementById('aiStatus').textContent='未连接';toast('AI 接口未连接')}finally{document.getElementById('sendBtn').disabled=false;renderChat()}}
function account(){openModal(`<h2>云端账号</h2><p class="note">当前版本保留 Supabase 接口位置。你部署后可在顶部脚本中填写 Supabase URL / anon key，再启用账号云同步。</p><div class="empty">现在无需账号也能本地复习、AI 对话、导入导出。</div>`)}
document.getElementById('reviewBtn').onclick=review;document.getElementById('quizBtn').onclick=quiz;document.getElementById('addBtn').onclick=add;document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=importData;document.getElementById('shareBtn').onclick=makeShare;document.getElementById('accountBtn').onclick=account;document.getElementById('closeBtn').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;save()});document.getElementById('sendBtn').onclick=askAI;document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();askAI()}});document.getElementById('clearChatBtn').onclick=()=>{state.chat=[];save();toast('AI 对话已清空')};
readShare();render();
</script></body></html>
